function controls(){$('teacherTools').hidden=role!=='teacher';$('retryVideo').hidden=!role;$('playVideo').hidden=!role;for(const id of ['next','topic','mode','sync'])$(id).disabled=role==='student';$('enter').hidden=!!role;$('name').disabled=!!role;$('leave').hidden=!role;$('screen').hidden=role!=='teacher';$('screen').disabled=!navigator.mediaDevices?.getDisplayMedia}
function removePeer(id){const p=peers.get(id);if(p){p.pc.onconnectionstatechange=null;p.pc.oniceconnectionstatechange=null;p.pc.close();p.v.remove();peers.delete(id)}participants.delete(id);updateStatus()}
async function makePeer(id){if(peers.has(id))return peers.get(id);const iceServers=[{urls:'stun:stun.l.google.com:19302'}];if($('turn').value)iceServers.push({urls:$('turn').value,username:$('turnUser').value,credential:$('turnPass').value});const pc=new RTCPeerConnection({iceServers}),v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.controls=true;$('videos').append(v);let p={pc,v,queue:[],making:false};peers.set(id,p);for(const t of stream?.getTracks()||[])pc.addTrack(t.kind==='video'&&displayTrack?displayTrack:t,stream);const remote=new MediaStream();v.srcObject=remote;pc.ontrack=e=>{if(e.streams[0])v.srcObject=e.streams[0];else{if(!remote.getTracks().some(t=>t.id===e.track.id))remote.addTrack(e.track);v.srcObject=remote;}v.muted=true;v.play().then(()=>{v.muted=false;return v.play()}).catch(()=>{$('playVideo').hidden=false});};pc.onconnectionstatechange=updateStatus;pc.oniceconnectionstatechange=updateStatus;pc.onsignalingstatechange=updateStatus;pc.onicegatheringstatechange=updateStatus;return p}
async function gatherICE(pc){if(pc.iceGatheringState==='complete')return;await new Promise(resolve=>{let timer=setTimeout(done,10000);function done(){clearTimeout(timer);pc.removeEventListener('icegatheringstatechange',check);resolve()}function check(){if(pc.iceGatheringState==='complete')done()}pc.addEventListener('icegatheringstatechange',check);check()})}
async function offer(id){let p=await makePeer(id);if(p.making||p.pc.signalingState!=='stable')return;p.making=true;try{await p.pc.setLocalDescription(await p.pc.createOffer());await gatherICE(p.pc);if(peers.get(id)!==p)return;signal('offer',{description:p.pc.localDescription.toJSON()},id)}finally{p.making=false}}
async function receive(o){if(o.type==='chat'&&o.user==='megumi-classroom-v2'){try{o=JSON.parse(o.text)}catch{return}}if(o.type==='stats'){ $('roomInfo').textContent='En el aula: '+o.clients;return}if(o.type!=='signal'||o.app!=='megumi-chinese-v1'||o.from===selfId||(o.to&&o.to!==selfId)||o.pin!==room)return;const id=o.from,a=o.action,x=o.payload||{};rx++;diagnostic();
if(a==='hello'){participants.set(id,Date.now());if(role==='teacher'&&o.role==='student'){if(!peers.has(id)){signal('welcome',{round},id);await offer(id)}else signal('present',{},id)}if(role==='student'&&o.role==='teacher'&&!teacher)signal('hello',{},id);return}
if(a==='welcome'&&role==='student'&&o.role==='teacher'){if(teacher&&teacher!==id)return;teacher=id;participants.set(id,Date.now());if(x.round){round=x.round;$('mode').value=round.m;$('topic').value=round.topic;render(round)}return}
if(a==='bye'){removePeer(id);if(id===teacher){teacher='';$('status').textContent='La profesora ha salido'}return}
if(role==='student'&&!teacher&&o.role==='teacher'&&['offer','ice'].includes(a))teacher=id;if(role==='student'&&id!==teacher)return;if(role==='teacher'&&o.role!=='student')return;
participants.set(id,Date.now());
if(a==='offer'&&role==='student'){const description=o.offer||x.description;let old=peers.get(id);if(old?.lastOffer===description.sdp)return;if(old?.pc.remoteDescription)removePeer(id);const p=await makePeer(id);p.lastOffer=description.sdp;await p.pc.setRemoteDescription(new RTCSessionDescription(description));await p.pc.setLocalDescription(await p.pc.createAnswer());await gatherICE(p.pc);if(peers.get(id)===p)signal('answer',{description:p.pc.localDescription.toJSON()},id)}
if(a==='answer'&&role==='teacher'){const p=peers.get(id);if(p&&p.pc.signalingState==='have-local-offer'){await p.pc.setRemoteDescription(new RTCSessionDescription(o.answer||x.description));for(const c of p.queue.splice(0))await p.pc.addIceCandidate(c)}}
if(a==='ice'){const p=await makePeer(id);if(p.pc.remoteDescription)await p.pc.addIceCandidate(x.candidate);else p.queue.push(x.candidate)}
if(a==='reset'&&role==='student'){removePeer(id);signal('hello',{},id);return}if(a==='retry'&&role==='teacher'){removePeer(id);signal('welcome',{round},id);await offer(id)}if(a==='instruction'&&role==='student'){applyInstruction(x);signal('ack',{kind:x.kind},id)}if(a==='ack'&&role==='teacher'){$('roomInfo').textContent='Recibido por '+o.name;}if(a==='activity'&&role==='student'&&x.round?.w){round=x.round;signal('ack',{kind:'activity'},id);$('mode').value=round.m;$('topic').value=round.topic;render(round)}
if(a==='result'&&role==='teacher')showResult({...x,name:o.name});
if(a==='drawing'&&role==='teacher'&&typeof x.image==='string'&&x.image.startsWith('data:image/png;base64,')&&x.image.length<1500000){let d=document.createElement('div');d.textContent=o.name;let img=document.createElement('img');img.src=x.image;img.style.width='100%';d.append(img);$('players').prepend(d)}
}
async function enter(as){if(role)return;const name=$('name').value.trim();if(!name){$('name').focus();error(Error('Escribe tu nombre'));return}const pin='megumi-studio-permanent-v1';try{await media()}catch(e){error(e);return}role=as;room='megumi-classroom-v4';selfId=crypto.randomUUID();controls();$('status').textContent='Conectando con Render…';ws=new WebSocket(endpoint);ws.onopen=()=>{ws.send(JSON.stringify({type:'ping',pin:room}));signal('hello');updateStatus();heartbeat=setInterval(()=>{ws.send(JSON.stringify({type:'ping',pin:room}));signal('hello');for(const [id,t] of participants)if(Date.now()-t>45000)removePeer(id)},12000)};let queue=Promise.resolve();ws.onmessage=e=>{queue=queue.then(()=>receive(JSON.parse(e.data))).catch(error)};ws.onerror=()=>{$('status').textContent='Error de conexión con Render'};ws.onclose=()=>{clearInterval(heartbeat);$('status').textContent='Render desconectado. Sal y vuelve a entrar.'}}
function leave(){signal('bye');clearInterval(heartbeat);if(ws){ws.onclose=null;ws.close();ws=null}for(const id of [...peers.keys()])removePeer(id);participants.clear();if(displayTrack){displayTrack.stop();displayTrack=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$('local').srcObject=null}role='';teacher='';room='';controls();$('status').textContent='Modo práctica individual';$('roomInfo').textContent=''}
$('enter').onclick=()=>enter($('name').value.trim().toLowerCase()==='megumi'?'teacher':'student');$('name').addEventListener('keydown',e=>{if(e.key==='Enter'&&!role)$('enter').click()});$('leave').onclick=leave;
$('screen').onclick=async()=>{try{if(displayTrack){displayTrack.stop();await restore();return}const s=await navigator.mediaDevices.getDisplayMedia({video:true});displayTrack=s.getVideoTracks()[0];for(const p of peers.values()){const sender=p.pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(displayTrack)}displayTrack.onended=restore;$('local').srcObject=s;$('screen').textContent='Dejar de compartir'}catch(e){error(e)}};
async function restore(){displayTrack=null;for(const p of peers.values()){const sender=p.pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(stream?.getVideoTracks()[0]||null)}$('local').srcObject=stream;$('screen').textContent='Compartir pantalla'}
function applyInstruction(x){if(x.kind==='audio')say(current);if(x.kind==='hint')$('classMessage').textContent='Pista: '+current[0]+' · '+current[1];if(x.kind==='reveal'){$('classMessage').textContent=current[3]+' '+current[0]+' · '+current[1]+' · '+current[2];locked=true}if(x.kind==='message')$('classMessage').textContent=String(x.text).slice(0,300);if(x.kind==='pause'){paused=!!x.value;$('classMessage').textContent=paused?'Actividad en pausa · 暫停':'Continuamos · 繼續'}}function instruct(kind,extra={}){const x={kind,...extra};applyInstruction(x);signal('instruction',x)}$('hint').onclick=()=>instruct('hint');$('reveal').onclick=()=>instruct('reveal');$('again').onclick=()=>instruct('audio');$('praise').onclick=()=>instruct('message',{text:'太棒了！ ¡Muy bien!'});$('pause').onclick=()=>instruct('pause',{value:!paused});$('sendMessage').onclick=()=>{instruct('message',{text:$('message').value});$('message').value=''};$('playVideo').onclick=()=>{for(const p of peers.values()){p.v.muted=false;p.v.play().catch(error)}};$('retryVideo').onclick=async()=>{if(role==='student'){if(teacher){removePeer(teacher);signal('retry',{},teacher)}else signal('hello')}else{const ids=[...peers.keys()];for(const id of ids){removePeer(id);signal('reset',{},id)}signal('hello')}};controls();window.addEventListener('pagehide',leave);
</script></html>
