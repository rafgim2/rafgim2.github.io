$('wbFull').onclick=async()=>{const p=$('whiteboardPanel');if(p.classList.contains('full')){await wbExitFull();return}wbFullState(true);try{if(p.requestFullscreen)await p.requestFullscreen();else if(p.webkitRequestFullscreen)await p.webkitRequestFullscreen()}catch(e){/* iOS fallback: fill the available viewport */}};
let wbNativeWasActive=false;function wbNativeChanged(){const active=(document.fullscreenElement||document.webkitFullscreenElement)===$('whiteboardPanel');if(active)wbFullState(true);else if(wbNativeWasActive)wbFullState(false);wbNativeWasActive=active}
document.addEventListener('fullscreenchange',wbNativeChanged);document.addEventListener('webkitfullscreenchange',wbNativeChanged);window.visualViewport?.addEventListener('resize',()=>{if($('whiteboardPanel').classList.contains('full'))requestAnimationFrame(wbDraw)});
$('wbEraser').onclick=()=>{wbEraser=!wbEraser;$('wbEraser').style.background=wbEraser?'#f4c8b9':''};
$('wbUndo').onclick=()=>wbAdd(wbMake('undo'));
$('wbClear').onclick=()=>{if(confirm('¿Borrar la pizarra para todos?'))wbAdd(wbMake('clear'))};
wbCanvas.addEventListener('pointerdown',e=>{if(!role)return;e.preventDefault();wbCanvas.setPointerCapture(e.pointerId);wbActive=wbMake('stroke',{color:wbEraser?'#ffffff':$('wbColor').value,width:wbEraser?Math.max(20,+$('wbWidth').value*3):+$('wbWidth').value,points:[wbPoint(e)]});wbOps.push(wbActive);wbSeen.add(wbActive.id);wbDraw()});
wbCanvas.addEventListener('pointermove',e=>{if(!wbActive)return;e.preventDefault();const p=wbPoint(e),a=wbActive.points,last=a[a.length-1];if(Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])<.001)return;a.push(p);wbDraw();signal('wb-live',{op:wbActive})});
function wbFinish(){if(!wbActive)return;const op=wbActive;wbActive=null;signal('wb-op',{op})}
wbCanvas.addEventListener('pointerup',wbFinish);wbCanvas.addEventListener('pointercancel',wbFinish);
function wbReceive(action,x){if(action==='wb-open'){wbOpen(!!x.open,false);return true}if(action==='wb-sync'){if(Array.isArray(x.ops)){wbOps=x.ops.slice(-1500);wbSeen=new Set(wbOps.map(v=>v.id));wbDraw();wbOpen(!!x.open,false)}return true}if(action==='wb-live'){const op=x.op;if(!op||!op.id||!Array.isArray(op.points))return true;const idx=wbOps.findIndex(v=>v.id===op.id);if(idx>=0)wbOps[idx]=op;else{wbOps.push(op);wbSeen.add(op.id)}wbDraw();return true}if(action==='wb-op'){const op=x.op;if(op?.kind==='stroke'){const idx=wbOps.findIndex(v=>v.id===op.id);if(idx>=0){wbOps[idx]=op;wbDraw();return true}}wbAdd(op,true);return true}return false}
</script></html>
