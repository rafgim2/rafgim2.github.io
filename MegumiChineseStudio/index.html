if(a==='reset'&&role==='student'){removePeer(id);teacher=id;signal('hello',{},id);return}if(a==='retry'&&role==='teacher'){removePeer(id);signal('welcome',{round:gamesActive?round:null,active:gamesActive},id);await offer(id)}if(a==='ack'&&role==='teacher'){$('roomInfo').textContent='Recibido por '+o.name;}if(a==='games-end'&&role==='student'){setGames(false);return}if(a==='activity'&&role==='student'&&x.round?.w){setGames(true);round=x.round;lessonId=round.lessonId||'';signal('ack',{kind:'activity'},id);$('mode').value=round.m;$('topic').value=round.topic;render(round)}

async function enter(as){if(role)return;const name=$('name').value.trim();if(!name){$('name').focus();error(Error('Escribe tu nombre'));return}const pin='megumi-studio-permanent-v1';try{await media()}catch(e){error(e);return}role=as;gamesActive=false;$('status').hidden=true;room='megumi-classroom-v8';selfId=crypto.randomUUID();controls();$('status').textContent='Preparando vídeo…';$('status').textContent='Conectando con Render…';ws=new WebSocket(endpoint);ws.onopen=()=>{ws.send(JSON.stringify({type:'ping',pin:room}));ws.send(JSON.stringify({type:'classroom-register',pin:room,id:selfId}));startRelay();signal('hello');updateStatus();heartbeat=setInterval(()=>{ws.send(JSON.stringify({type:'ping',pin:room}));signal('hello');for(const [id,t] of participants)if(Date.now()-t>45000){removePeer(id);liveStudents.delete(id);renderLive()}},12000)};let queue=Promise.resolve();ws.onmessage=e=>{let o;try{o=JSON.parse(e.data)}catch{return}if(o.type==='classroom-media'){receiveRelay(o);return}queue=queue.then(()=>receive(o)).catch(error)};ws.onerror=()=>{$('status').hidden=false;$('status').textContent='No se ha podido conectar'};ws.onclose=()=>{stopRelay();clearInterval(heartbeat);$('status').hidden=false;$('status').textContent='Conexión perdida. Sal y vuelve a entrar.'}}
function leave(){cancelAdvance();if(gameAudio){gameAudio.close().catch(()=>{});gameAudio=null}signal('bye');stopRelay();clearInterval(heartbeat);if(ws){ws.onclose=null;ws.close();ws=null}for(const id of [...peers.keys()])removePeer(id);participants.clear();liveStudents.clear();$('liveHistory').replaceChildren();renderLive();if(displayTrack){displayTrack.stop();displayTrack=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$('local').srcObject=null}role='';teacher='';room='';setGames(false);controls();$('status').textContent='Modo práctica individual';$('roomInfo').textContent=''}
$('enter').onclick=()=>enter($('name').value.trim().toLowerCase()==='megumi'?'teacher':'student');$('name').addEventListener('keydown',e=>{if(e.key==='Enter'&&!role)$('enter').click()});$('leave').onclick=leave;
$('screen').onclick=async()=>{try{if(displayTrack){displayTrack.stop();await restore();return}const s=await navigator.mediaDevices.getDisplayMedia({video:true});displayTrack=s.getVideoTracks()[0];for(const p of peers.values()){const sender=p.pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(displayTrack)}displayTrack.onended=restore;$('local').srcObject=s;$('screenLabel').textContent='Detener'}catch(e){error(e)}};
async function restore(){displayTrack=null;for(const p of peers.values()){const sender=p.pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(stream?.getVideoTracks()[0]||null)}$('local').srcObject=stream;$('screenLabel').textContent='Compartir'}
function applyInstruction(x){if(x.kind==='audio')say(current);if(x.kind==='hint')$('classMessage').textContent='Pista: '+current[0]+' · '+current[1];if(x.kind==='reveal'){$('classMessage').textContent=current[3]+' '+current[0]+' · '+current[1]+' · '+current[2];locked=true}if(x.kind==='message')$('classMessage').textContent=String(x.text).slice(0,300);if(x.kind==='pause'){paused=!!x.value;$('classMessage').textContent=paused?'Actividad en pausa · 暫停':'Continuamos · 繼續'}}function instruct(kind,extra={}){const x={kind,...extra};applyInstruction(x);signal('instruction',x)}$('playVideo').onclick=()=>{relayAudio?.resume().catch(error);for(const p of peers.values()){p.v.muted=false;p.v.play().catch(error)}};$('retryVideo').onclick=async()=>{if(role==='student'){if(teacher){const id=teacher;removePeer(id);teacher=id;signal('retry',{},id)}else signal('hello')}else{const ids=[...peers.keys()];for(const id of ids){removePeer(id);signal('reset',{},id)}signal('hello')}};controls();window.addEventListener('pagehide',leave);
